[package]
name = "peppol-imr"
version = "0.1.0"
edition = "2024"
description = "Peppol BIS Invoice Message Response 3.0 — ApplicationResponse validation and rules"

[dependencies]
ubl-common = { path = "../ubl-common" }
ubl-documents = { path = "../ubl-documents" }
peppol-common = { path = "../peppol-common" }
serde = { version = "1", features = ["derive"] }
chrono = { version = "0.4", features = ["serde"] }
rust_decimal = { version = "1", features = ["serde"] }

[dev-dependencies]
serde_json = "1"
