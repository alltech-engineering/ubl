[package]
name = "peppol-storage"
version = "0.1.0"
edition = "2024"
description = "Peppol document storage — async trait with in-memory and PostgreSQL backends"

[dependencies]
async-trait = "0.1"
tokio = { version = "1", features = ["sync", "fs", "rt", "macros"] }
serde = { workspace = true }
serde_json = "1"
sqlx = { version = "0.8", features = ["postgres", "runtime-tokio", "chrono", "uuid"] }
chrono = { workspace = true }
uuid = { version = "1", features = ["v4", "serde"] }
thiserror = { workspace = true }
peppol-xml = { path = "../peppol-xml" }
ubl-documents = { path = "../ubl-documents" }
ubl-xml = { path = "../ubl-xml" }
peppol-common = { path = "../peppol-common" }
