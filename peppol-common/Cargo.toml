[package]
name = "peppol-common"
version = "0.1.0"
edition = "2024"
description = "Peppol e-procurement shared infrastructure — participant IDs, code lists, schematron engine"

[dependencies]
ubl-common = { path = "../ubl-common" }
ubl-documents = { path = "../ubl-documents" }
serde = { version = "1", features = ["derive"] }
chrono = { version = "0.4", features = ["serde"] }
rust_decimal = { version = "1", features = ["serde"] }

[dev-dependencies]
serde_json = "1"
