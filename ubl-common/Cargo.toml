[package]
name = "ubl-common"
version = "0.1.0"
edition = "2024"
description = "UBL 2.5 Common Basic Components (CBC) and Common Aggregate Components (CAC)"

[dependencies]
serde = { version = "1", features = ["derive"] }
rust_decimal = { version = "1", features = ["serde"] }
chrono = { version = "0.4", features = ["serde"] }

[dev-dependencies]
serde_json = "1"
