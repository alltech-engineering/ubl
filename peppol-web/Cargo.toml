[package]
name = "peppol-web"
version = "0.1.0"
edition = "2024"
description = "Peppol UBL Order capture web frontend"

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = "0.3"
