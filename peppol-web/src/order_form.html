<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Peppol UBL Order — Complete Capture</title>
<style>
:root {
  --bg: #0d1117; --surface: #161b22; --border: #30363d;
  --text: #c9d1d9; --muted: #8b949e; --accent: #58a6ff;
  --danger: #f85149; --warn: #d2991d; --ok: #3fb950;
  --input-bg: #0d1117; --input-border: #30363d;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'Fira Code', 'SF Mono', monospace; background: var(--bg); color: var(--text); font-size: 13px; line-height: 1.5; padding: 20px; max-width: 1200px; margin: 0 auto; }
h1 { color: var(--accent); font-size: 18px; margin-bottom: 20px; }
h2 { font-size: 14px; margin: 0; cursor: pointer; user-select: none; display: flex; align-items: center; gap: 6px; }
h2 .arrow { display: inline-block; width: 12px; transition: transform .2s; }
h2 .arrow.open { transform: rotate(90deg); }
.section { background: var(--surface); border: 1px solid var(--border); border-radius: 6px; margin-bottom: 12px; overflow: hidden; }
.section-header { padding: 10px 14px; display: flex; justify-content: space-between; align-items: center; cursor: pointer; }
.section-header:hover { background: rgba(255,255,255,.03); }
.section-body { padding: 0 14px 14px; display: none; }
.section-body.open { display: block; }
.field-group { margin-bottom: 10px; }
.field-row { display: flex; gap: 10px; align-items: flex-end; flex-wrap: wrap; margin-bottom: 6px; }
.field { display: flex; flex-direction: column; min-width: 160px; }
.field label { font-size: 11px; color: var(--muted); margin-bottom: 2px; }
.field label .req { color: var(--danger); }
.field input, .field select, .field textarea { background: var(--input-bg); border: 1px solid var(--input-border); border-radius: 4px; color: var(--text); padding: 5px 8px; font-family: inherit; font-size: 12px; }
.field input:focus, .field select:focus { border-color: var(--accent); outline: none; }
input[type="checkbox"] { width: auto; }
.sub-group { border: 1px solid var(--border); border-radius: 4px; padding: 8px; margin: 6px 0; }
.sub-group-title { color: var(--accent); font-size: 12px; margin-bottom: 6px; }
.btn { background: var(--surface); border: 1px solid var(--border); color: var(--accent); padding: 6px 14px; border-radius: 4px; cursor: pointer; font-family: inherit; font-size: 12px; }
.btn:hover { background: rgba(88,166,255,.1); }
.btn.danger { color: var(--danger); }
.btn.primary { background: #238636; border-color: #238636; color: #fff; font-weight: bold; }
.btn.primary:hover { background: #2ea043; }
.btn-row { display: flex; gap: 8px; margin-top: 10px; }
#results { margin-top: 16px; padding: 14px; border-radius: 6px; display: none; }
#results.error { background: rgba(248,81,73,.1); border: 1px solid var(--danger); display: block; }
#results.warn { background: rgba(210,153,29,.1); border: 1px solid var(--warn); display: block; }
#results.ok { background: rgba(63,185,80,.1); border: 1px solid var(--ok); display: block; }
.result-item { padding: 4px 0; font-size: 12px; }
.result-item.e { color: var(--danger); }
.result-item.w { color: var(--warn); }
</style>
</head>
<body>
<h1>UBL Order — Complete Capture</h1>
<form id="order-form">
<!-- Sections auto-generated by script below -->
</form>
<div id="results"></div>
<div class="btn-row" style="margin-top:20px">
  <button type="button" class="btn primary" onclick="submitOrder()">Submit Order</button>
  <button type="button" class="btn" onclick="fillDummyData()">Fill with Dummy Data</button>
  <span id="status"></span>
</div>

// ============================================================================
// RENDER
// ============================================================================

let lineCounter = 1;

function renderField(f) {
  const uid = f.ubl.join('_').replace(/[\[\].'$]/g,'');
  const dubl = f.ubl.map(x => x === '$' ? 0 : x).join('.');
  let html = '<div class="field">';
  html += `<label for="${uid}">${f.req?'<span class="req">*</span> ':''}${f.label}</label>`;
  if (f.t === 'c') {
    html += `<input type="checkbox" id="${uid}" data-ubl="${dubl}">`;
  } else if (f.t === 's') {
    html += `<select id="${uid}" data-ubl="${dubl}">`;
    for (const o of (f.opts||[])) {
      const [val, label] = o.includes('=') ? o.split('=',2) : [o,o];
      html += `<option value="${val}">${label||val}</option>`;
    }
    html += '</select>';
  } else if (f.t === 'ta') {
    html += `<textarea id="${uid}" data-ubl="${dubl}" rows="2" placeholder="${f.placeholder||''}"></textarea>`;
  } else {
    html += `<input type="${f.t==='d'?'date':f.t==='ti'?'time':f.t==='n'?'number':f.t==='text'?'text':'text'}" id="${uid}" data-ubl="${dubl}" placeholder="${f.placeholder||''}">`;
  }
  html += '</div>';
  return html;
}

function renderSection(sec) {
  let html = `<div class="section" id="sec-${sec.id}">`;
  html += `<div class="section-header" onclick="toggleSection('sec-${sec.id}')">`;
  html += `<h2><span class="arrow ${sec.open?'open':''}" id="arrow-${sec.id}">▶</span> ${sec.title}</h2>`;
  html += '</div>';
  html += `<div class="section-body ${sec.open?'open':''}" id="body-${sec.id}">`;

  if (sec.id === 'order_lines') {
    html += renderOrderLines();
  } else {
    html += '<div class="field-row">';
    for (const f of sec.fields) {
      html += renderField(f);
    }
    html += '</div>';
  }

  html += '</div></div>';
  return html;
}

function renderOrderLines() {
  let html = '<div id="lines-container">';
  for (let i = 0; i < lineCounter; i++) {
    html += renderOneLine(i);
  }
  html += '</div>';
  html += `<button type="button" class="btn" onclick="addLine()">+ Add Order Line</button>`;
  return html;
}

function renderOneLine(idx) {
  const fields = buildLineItemFields(idx);
  let html = `<div class="sub-group" id="line-${idx}">`;
  html += `<div class="sub-group-title">Order Line ${idx+1}`;
  if (lineCounter > 1) html += ` <button type="button" class="btn danger" onclick="removeLine(${idx})" style="float:right;font-size:11px;padding:2px 8px">Remove</button>`;
  html += '</div>';

  // OrderLine container fields
  html += '<div class="field-row">';
  html += renderField({label:'Substitution Status', ubl:['order_line',idx,'substitution_status_code','value'], t:'s', opts:['','original','substitution']});
  html += renderField({label:'Line Note', ubl:['order_line',idx,'note',0,'value'], t:'t'});
  html += '</div>';

  // LineItem fields
  html += '<div style="color:var(--muted);font-size:11px;margin:4px 0">Line Item</div>';
  html += '<div class="field-row">';
  for (const f of fields) {
    html += renderField(f);
  }
  html += '</div>';

  // Additional Item Properties (dynamic key-value)
  html += `<div style="color:var(--muted);font-size:11px;margin:6px 0">Additional Item Properties <button type="button" class="btn" style="padding:2px 8px;font-size:11px" onclick="addItemProp(${idx})">+ Add</button></div>`;
  html += `<div id="item-props-${idx}"></div>`;

  // Substitute line items
  html += '<div style="color:var(--muted);font-size:11px;margin:6px 0">Substitute Line Items (seller/buyer proposed alternatives)</div>';
  html += '<div class="field-row">';
  html += renderField({label:'Seller Proposed Item Name', ubl:['order_line',idx,'seller_proposed_substitute_line_item','item','name'], t:'t'});
  html += renderField({label:'Seller Proposed Item ID', ubl:['order_line',idx,'seller_proposed_substitute_line_item','item','sellers_item_identification','id','value'], t:'t'});
  html += renderField({label:'Seller Substituted Item Name', ubl:['order_line',idx,'seller_substituted_line_item','item','name'], t:'t'});
  html += renderField({label:'Buyer Proposed Item Name', ubl:['order_line',idx,'buyer_proposed_substitute_line_item','item','name'], t:'t'});
  html += '</div>';

  // Order line references
  html += '<div style="color:var(--muted);font-size:11px;margin:4px 0">Order Line References</div>';
  html += '<div class="field-row">';
  html += renderField({label:'Quotation Line Ref ID', ubl:['order_line',idx,'quotation_line_reference',0,'line_id','value'], t:'t'});
  html += renderField({label:'Order Line Ref ID', ubl:['order_line',idx,'order_line_reference',0,'line_id','value'], t:'t'});
  html += renderField({label:'Document Ref ID', ubl:['order_line',idx,'document_reference',0,'id','value'], t:'t'});
  html += renderField({label:'Document Type Code', ubl:['order_line',idx,'document_reference',0,'document_type_code','value'], t:'t'});
  html += '</div>';

  html += '</div>';
  return html;
}

function addLine() {
  lineCounter++;
  rebuildLines();
}

function removeLine(idx) {
  if (lineCounter <= 1) return;
  // Remove that index
  lineCounter--;
  rebuildLines();
}

function rebuildLines() {
  const container = document.getElementById('lines-container');
  let html = '';
  for (let i = 0; i < lineCounter; i++) {
    html += renderOneLine(i);
  }
  container.innerHTML = html;
}

function renderAll() {
  const form = document.getElementById('order-form');

}

function toggleSection(id) {
  const body = document.getElementById('body-' + id.replace('sec-',''));

// Additional Item Properties — dynamic key-value pairs
function addItemProp(lineIdx) {
  const container = document.getElementById('item-props-' + lineIdx);
  const idx = container.children.length;
  const html = `<div class="field-row" id="iprop-${lineIdx}-${idx}">
    ${renderField({label:'Property Name', ubl:['order_line',lineIdx,'line_item','item','additional_item_property',idx,'name'], t:'t'})}
    ${renderField({label:'Property Value', ubl:['order_line',lineIdx,'line_item','item','additional_item_property',idx,'value','value'], t:'t'})}

  </div>`;
  container.insertAdjacentHTML('beforeend', html);
}

// ============================================================================
// JSON BUILDER — walks data-ubl attributes to construct nested JSON
// ============================================================================

function setPath(obj, path, value) {
  // Path like "buyer_customer_party.party.party_name.0.name"
  const parts = path.split('.');
  let cur = obj;
  for (let i = 0; i < parts.length - 1; i++) {
    const key = parts[i];
    if (key === '$increment') {
      // find first null index in array
      let idx = 0;
      while (cur[idx] !== undefined) idx++;
      cur = cur[idx] = {};
    } else if (/^\d+$/.test(key)) {
      const idx = parseInt(key);
      if (!cur[idx]) cur[idx] = {};
      cur = cur[idx];
    } else {
      if (!cur[key]) {
        // next part determines type
        const next = parts[i+1];
        cur[key] = /^\d+$/.test(next) || next === '$increment' ? [] : {};
      }
      cur = cur[key];
    }
  }
  const last = parts[parts.length-1];
  if (last === '$increment') {
    let idx = 0;
    while (cur[idx] !== undefined) idx++;
    cur[idx] = value;
  } else if (/^\d+$/.test(last)) {
    cur[parseInt(last)] = value;
  } else {
    cur[last] = value;
  }
}

function collectJSON() {
  const obj = {};
  const inputs = document.querySelectorAll('#order-form [data-ubl]');
  for (const el of inputs) {
    let value;
    if (el.type === 'checkbox') {
      if (!el.checked) continue;
      value = true;
    } else {
      value = el.value.trim();
      if (!value) continue;
      if (el.type === 'number') value = value.includes('.') ? value : value; // keep as string for Decimal
    }
    setPath(obj, el.dataset.ubl, value);
  }
  return obj;
}

// ============================================================================
// SUBMIT
// ============================================================================

async function submitOrder() {
  const status = document.getElementById('status');
  const results = document.getElementById('results');
  status.textContent = 'Validating...';
  results.style.display = 'none';

  const json = collectJSON();
  // Ensure order_line exists
  if (!json.order_line || json.order_line.length === 0) {
    status.textContent = 'Error: At least one order line required';
    return;
  }

  try {
    const resp = await fetch(API, {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify(json),
    });
    const data = await resp.json();

    results.style.display = 'block';
    results.className = data.valid ? 'ok' : (data.errors && data.errors.length ? 'error' : 'warn');

    let html = `<strong>${data.valid ? 'PASSED' : 'FAILED'}</strong> — stored: ${data.stored_id}<br>`;
    if (data.errors) for (const e of data.errors) html += `<div class="result-item e">✗ ${e.rule_id}: ${e.message}</div>`;
    if (data.warnings) for (const w of data.warnings) html += `<div class="result-item w">⚠ ${w.rule_id}: ${w.message}</div>`;
    results.innerHTML = html;
    status.textContent = data.valid ? 'Valid' : 'Has errors — see below';
  } catch(e) {
    status.textContent = 'Network error: ' + e.message;
  }
}

  document.querySelectorAll('#order-form [data-ubl]').forEach(el => {

  });
}

// South African sane defaults
function setZADefaults() {
  const defaults = {
    // Currency — all ZAR
    'document_currency_code_value': 'ZAR',
    'requested_invoice_currency_code_value': 'ZAR',
    'pricing_currency_code_value': 'ZAR',
    'tax_currency_code_value': 'ZAR',
    // Country — ZA everywhere
    'delivery_0_delivery_address_country_identification_code_value': 'ZA',
    'destination_country_identification_code_value': 'ZA',
    // Party defaults are set via buildPartyFields path (handled below)
    // Tax category — Standard (S)
    'tax_total_0_tax_subtotal_0_tax_category_id_value': 'S',

    // Payment means — Credit transfer (30)
    'payment_means_0_payment_means_code_value': '30',
    // Order type — Purchase Order
    'order_type_code_value': '220',
    // UBL version
    'ubl_version_id_value': '2.5',
  };

  // Set all text/number/select defaults
  for (const [id, val] of Object.entries(defaults)) {
    const el = document.getElementById(id);
    if (el) el.value = val;
  }

  // Set ZA defaults for buyer/seller parties via data-ubl path matching
  document.querySelectorAll('#order-form [data-ubl]').forEach(el => {
    const path = el.dataset.ubl;
    // Country code fields default to ZA
    if (path.includes('country.identification_code.value') && !el.value) el.value = 'ZA';
    // Party ID scheme defaults to 9933
    if (path.includes('party_identification') && path.endsWith('.scheme_id') && !el.value) el.value = '9933';
    // Tax scheme defaults to VAT

    // Tax category defaults to S
    if (path.includes('tax_category.id.value') && !el.value) el.value = 'S';
    if (path.includes('tax_scheme.id.value') && !el.value) el.value = 'VAT';

    // Unit code defaults to EA
    if (path.endsWith('.unit_code') && !el.value) el.value = 'EA';
  });

  // Set ZAR currency on all amount currency_id fields + "0" on value fields
  document.querySelectorAll('#order-form [data-ubl]').forEach(el => {
    const path = el.dataset.ubl;
    if (path.endsWith('.currency_id') && !el.value) el.value = 'ZAR';
    if (path.endsWith('.value') && path.includes('amount') || path.includes('quantity') && !el.value) el.value = '0';
  });
}
