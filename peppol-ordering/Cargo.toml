[package]
name = "peppol-ordering"
version = "0.1.0"
edition = "2024"
description = "Peppol BIS Ordering 3.x — Order, OrderResponse, OrderAgreement validation"

[dependencies]
ubl-common = { path = "../ubl-common" }
ubl-documents = { path = "../ubl-documents" }
peppol-common = { path = "../peppol-common" }
serde = { version = "1", features = ["derive"] }
chrono = { version = "0.4", features = ["serde"] }
rust_decimal = { version = "1", features = ["serde"] }

[dev-dependencies]
serde_json = "1"
