<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Peppol Order Form</title>
<style>
  body { font-family: system-ui, sans-serif; max-width: 640px; margin: 2rem auto; padding: 0 1rem; }
  label { display: block; margin: 0.75rem 0 0.25rem; font-weight: 600; }
  input, textarea { width: 100%; padding: 0.5rem; box-sizing: border-box; }
  textarea { font-family: monospace; font-size: 0.85rem; }
  button { margin-top: 1rem; padding: 0.6rem 1.5rem; font-size: 1rem; cursor: pointer; }
  #result { margin-top: 1rem; padding: 1rem; border-radius: 4px; white-space: pre-wrap; font-family: monospace; font-size: 0.85rem; }
  .success { background: #d4edda; color: #155724; }
  .error { background: #f8d7da; color: #721c24; }
  .info { background: #cce5ff; color: #004085; }
</style>
</head>
<body>
<h1>Peppol BIS Order</h1>
<p>Create a PEPPOL BIS 3.0 Order document. The JSON body will be POSTed to <code>/api/orders</code> for validation and storage.</p>

<form id="order-form">
  <label for="id">Order ID *</label>
  <input id="id" name="id" required placeholder="e.g. ORD-2026-0001">

  <label for="issue_date">Issue Date *</label>
  <input id="issue_date" name="issue_date" type="date" required>

  <label for="buyer_name">Buyer Party Name *</label>
  <input id="buyer_name" name="buyer_name" required placeholder="e.g. BuyerCo Ltd">

  <label for="seller_name">Seller Party Name *</label>
  <input id="seller_name" name="seller_name" required placeholder="e.g. Supplier Inc">

  <label for="order_line">Order Lines (JSON array) *</label>
  <textarea id="order_line" name="order_line" rows="10" required>[
  {
    "line_item": {
      "id": { "value": "1" },
      "quantity": { "value": 10, "unit_code": "EA" },
      "line_extension_amount": { "value": 150.00, "currency_id": "EUR" },
      "item": {
        "name": { "value": "Widget A" }
      }
    }
  }
]</textarea>
  <small>Array of OrderLine objects. Each line requires at minimum a line_item with id, quantity, line_extension_amount, and item.name.</small>

  <button type="submit">Submit Order</button>
</form>

<div id="result"></div>

<script>
document.getElementById('order-form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const resultEl = document.getElementById('result');
  resultEl.textContent = 'Submitting...';
  resultEl.className = 'info';

  const form = e.target;
  let orderLines;
  try {
    orderLines = JSON.parse(form.order_line.value);
  } catch (err) {
    resultEl.textContent = 'Invalid JSON in Order Lines: ' + err.message;
    resultEl.className = 'error';
    return;
  }

  const payload = {
    id: { value: form.id.value },
    issue_date: form.issue_date.value,
    buyer_customer_party: {
      party: {
        party_name: [{ name: { value: form.buyer_name.value } }]
      }
    },
    seller_supplier_party: {
      party: {
        party_name: [{ name: { value: form.seller_name.value } }]
      }
    },
    order_line: orderLines
  };

  try {
    const resp = await fetch('/api/orders', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload)
    });
    const data = await resp.json();
    resultEl.textContent = JSON.stringify(data, null, 2);
    resultEl.className = resp.ok ? 'success' : 'error';
  } catch (err) {
    resultEl.textContent = 'Network error: ' + err.message;
    resultEl.className = 'error';
  }
});
</script>
</body>
</html>
