[package]
name = "xml"
version = "0.1.0"
edition = "2024"
description = "UBL 2.5 XML serialization/deserialization adapter"

[dependencies]
ubl-common = { path = "../common" }
ubl-documents = { path = "../maindoc" }
quick-xml = { version = "0.40", features = ["serialize"] }
serde = { version = "1", features = ["derive"] }
chrono = { version = "0.4", features = ["serde"] }
rust_decimal = { version = "1", features = ["serde"] }

[dev-dependencies]
serde_json = "1"
